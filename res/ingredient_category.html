<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/water.css" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="ingredient_category.css" />
    <script src="wsr.js" wasm-url="/wasm/ingredient_category.wasm"></script>
    <script>
      window.onload = () => {
        const url = new URL(window.location.href);
        const category_id = url.searchParams.get("id");
        document.body.setAttribute(
          "wsr-get-1",
          `/ingredient_categories/${category_id}`,
        );
      };
    </script>
    <script src="sphearch2.js"></script>
    <script src="sphdelete-button.js"></script>
    <script src="header.js"></script>
  </head>
  <body
    wsr-generate-1="onCategory"
    wsr-get-2="/ingredients"
    wsr-generate-2="onIngredients"
  >
    <spheader-bar></spheader-bar>
    <input
      id="category_name_edit"
      class="common_edit_title"
      type="text"
      wsr-onevent="input"
      wsr-generate="onNameChange"
    />
    <h2>Ingredients</h2>
    <div id="ingredient_links" class="common_grid"></div>
    <br />
    <sphearch-bar
      id="add_ingredient_search"
      placeholder="Add an ingredient..."
      autoselect="true"
      wsr-onevent="input"
      wsr-generate="onIngredientSearchInput"
    ></sphearch-bar>
  </body>
</html>
