<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/water.css" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="ingredient.css" />
    <script src="header.js"></script>
    <script src="sphdelete-button.js"></script>
    <script src="sphearch2.js"></script>
    <script src="wsr.js" wasm-url="/wasm/ingredient.wasm"></script>
    <script>
      window.onload = () => {
        const url = new URL(window.location.href);
        const ingredient_id = url.searchParams.get("id");
        document.body["ingredient_id"] = ingredient_id;
        document.body.setAttribute(
          "wsr-get-1",
          `/ingredients/${ingredient_id}`,
        );
      };
      wsrCallbacks.focusWidget = function (id_ptr, id_len) {
        const id = getWasmString(id_ptr, id_len);
        const elem = document.getElementById(id);
        elem.focus();
        if (elem.select !== undefined) {
          elem.select();
        }
      };
    </script>
  </head>
  <!-- wsr-get-1 is dynamic and injected by js above -->
  <body
    wsr-generate-1="onIngredientResponse"
    wsr-get-2="/properties"
    wsr-generate-2="onPropertiesResponse"
    wsr-get-3="/ingredient_categories"
    wsr-generate-3="onCategoriesResponse"
  >
    <spheader-bar></spheader-bar>
    <input id="title" class="common_edit_title" type="text" wsr-onevent="input" wsr-generate="onNameEdit" />
    <input
      type="checkbox"
      id="complete_checkbox"
      wsr-onevent="click"
      wsr-generate="onCompleteChecked"
    />
    <label for="complete_checkbox"
      >I solemnly swear all information is entered and true</label
    >
    <div id="category_block">
      <button
        id="promote_category"
        wsr-onevent="click"
        wsr-generate="onPromoteClicked"
      >
        Promote to category
      </button>
    </div>
    <h2>Serving Info</h2>
    <div id="ingredient_values" class="common_grid">
      <label for="serving_size_g">Serving size (g)</label>
      <input
        id="serving_size_g"
        type="number"
        min="0"
        wsr-onevent="change"
        wsr-generate="servingSizeGChanged"
      />
      <label for="serving_size_ml">Serving size (ml)</label>
      <input
        id="serving_size_ml"
        type="number"
        min="0"
        wsr-onevent="change"
        wsr-generate="servingSizeMlChanged"
      />
      <label for="serving_size_pieces">Serving size (pieces)</label>
      <input
        id="serving_size_pieces"
        type="number"
        min="0"
        wsr-onevent="change"
        wsr-generate="servingSizePiecesChanged"
      />
    </div>
    <h2>Properties</h2>
    <div id="ingredient_properties"></div>
    <sphearch-bar
      id="new_property"
      autoselect="true"
      placeholder="Add a property..."
      wsr-onevent="input"
      wsr-generate="onPropertySearchInput"
    ></sphearch-bar>
  </body>
</html>
