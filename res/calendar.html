<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/water.css" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="calendar.css" />
    <script src="wsr.js" wasm-url="/wasm/calendar.wasm"></script>
    <script src="calendar.js"></script>
    <script>
      wsrCallbacks.triggerCalendarUpdate = () => {
        const calendar = document.getElementById("calendar");
        calendar.updateDates(new Date());
      };
    </script>
  </head>
  <body wsr-get="/meals" wsr-generate="onMeals">
    <h1>Calendar</h1>
    <sphaero-calendar
      id="calendar"
      wsr-onevent="sphcalendar-update"
      wsr-generate="onCalendarUpdate"
    ></sphaero-calendar>
  </body>
</html>
