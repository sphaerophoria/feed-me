<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/water.css" />
    <link rel="stylesheet" href="properties.css" />
    <script src="wsr.js" wasm-url="/wasm/properties.wasm"></script>
    <script src="header.js"></script>
  </head>
  <body>
    <spheader-bar></spheader-bar>
    <h1>Properties</h1>
    <div
      id="properties"
      wsr-get="/properties"
      wsr-generate="onProperties"
    ></div>
    <input
      id="new_property_name"
      placeholder="New property..."
      type="text"
      wsr-onevent="keyup"
      wsr-generate="newProperty"
    />
    <button id="add_new_property" wsr-event="click" wsr-generate="newProperty">
      Add
    </button>
  </body>
</html>
